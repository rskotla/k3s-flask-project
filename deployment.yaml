apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3s-flask-project
  namespace: k3s-flask
  labels:
    app: k3s-flask-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k3s-flask-project
  template:
    metadata:
      labels:
        app: k3s-flask-project
    spec:
      containers:
        - name: flask-app
          image: rohitkotla/k3s-flask-project:build-20
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
